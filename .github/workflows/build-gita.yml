name: Build Anu Gita data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build_anugita.py
      - name: Save to the repo
        run: |
          git config user.name "dot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Add Anu Gita data"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
