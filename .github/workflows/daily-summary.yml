name: Daily Dot Summary

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM India time, every day
  workflow_dispatch:
    inputs:
      article_url:
        description: "Optional: a specific Dot article link"
        required: false
      article_date:
        description: "Optional: summarise the story from this date (YYYY-MM-DD)"
        required: false
      request_id:
        description: "Set by the hub website; leave empty"
        required: false

concurrency:
  group: dot-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read and summarise
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
          ARTICLE_DATE: ${{ github.event.inputs.article_date }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: python summarize.py

      - name: Keep debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Save summaries to the repo
        run: |
          git config user.name "dot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add summaries || true
          if ! git diff --cached --quiet; then
            git commit -m "Summary $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
