name: Daily Dot Summary

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM India time, every day
  workflow_dispatch:
    inputs:
      article_url:
        description: "Optional: paste a specific Dot article link"
        required: false

permissions:
  contents: write

jobs:
  summarise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read and summarise
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ARTICLE_URL: ${{ github.event.inputs.article_url }}
        run: python summarize.py

      - name: Keep debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Save summaries to the repo
        run: |
          git config user.name "dot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add summaries || true
          git diff --cached --quiet || (git commit -m "Summary $(date -u +%F)" && git push)
